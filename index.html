<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声ウォーキングナビ</title>

    <!-- PWA設定 -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="192.png">
    <meta name="theme-color" content="#2c3e50">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Roboto, -apple-system, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h1 { font-size: 1.3rem; margin-bottom: 20px; color: #2c3e50; }
        .btn {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .btn-toggle { background-color: #2ecc71; }
        .btn-toggle.active { background-color: #e74c3c; }
        .btn-location { background-color: #3498db; }
        .data-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            text-align: left;
        }
        .data-label { font-size: 0.8rem; color: #7f8c8d; }
        .data-val { font-size: 1.2rem; font-weight: bold; color: #2c3e50; }
        .coords-box {
            font-size: 0.9rem;
            color: #34495e;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>音声ウォーキングナビ</h1>
    
    <button id="toggleBtn" class="btn btn-toggle" onclick="toggleTracking()">計測スタート</button>
    <button class="btn btn-location" onclick="speakCurrentLocation()">📍 緯度・経度を読み上げる</button>

    <div class="data-box">
        <div class="data-label">進行方向</div>
        <div class="data-val" id="dirVal">---</div>
    </div>
    <div class="data-box">
        <div class="data-label">経過時間</div>
        <div class="data-val" id="timeVal">0分</div>
    </div>
    <div class="data-box">
        <div class="data-label">移動距離</div>
        <div class="data-val" id="distVal">0 m</div>
    </div>
    <div class="data-box">
        <div class="data-label">現在地（緯度・経度）</div>
        <div class="data-val coords-box" id="coordsVal">未取得</div>
    </div>
</div>

<script>
    // Service Worker の登録（オフライン対応）
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker Registered'))
            .catch(err => console.error('SW Register Error:', err));
    }

    let isTracking = false;
    let watchId = null;
    let timerId = null;
    
    let startTime = null;
    let totalDistance = 0;
    let lastLat = null;
    let lastLng = null;
    let currentHeading = "不明";
    let lastAnnouncedMinute = 0;

    function toggleTracking() {
        const btn = document.getElementById('toggleBtn');
        if (isTracking) {
            isTracking = false;
            navigator.geolocation.clearWatch(watchId);
            clearInterval(timerId);
            btn.textContent = "計測スタート";
            btn.classList.remove('active');
            speak("計測を終了しました");
        } else {
            if (!navigator.geolocation) {
                alert("お使いの端末はGPSに対応していません");
                return;
            }
            isTracking = true;
            startTime = new Date();
            totalDistance = 0;
            lastLat = null;
            lastLng = null;
            lastAnnouncedMinute = 0;

            btn.textContent = "計測ストップ";
            btn.classList.add('active');
            speak("ウォーキングの計測を開始します");

            watchId = navigator.geolocation.watchPosition(updatePosition, handleError, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            });

            timerId = setInterval(checkTimeAndAnnounce, 10000);
        }
    }

    function updatePosition(pos) {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const heading = pos.coords.heading;

        // 画面の緯度・経度表示を更新
        document.getElementById('coordsVal').textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;

        if (heading !== null && !isNaN(heading)) {
            const newHeading = getDirection(heading);
            if (newHeading !== currentHeading) {
                currentHeading = newHeading;
                document.getElementById('dirVal').textContent = currentHeading;
                speak(`現在、${currentHeading}に向かって歩いています`);
            }
        }

        if (lastLat !== null && lastLng !== null) {
            const d = calculateDistance(lastLat, lastLng, lat, lng);
            if (d > 2) {
                totalDistance += d;
                document.getElementById('distVal').textContent = `${Math.round(totalDistance)} m`;
                lastLat = lat;
                lastLng = lng;
            }
        } else {
            lastLat = lat;
            lastLng = lng;
        }
    }

    // ボタンを押したときに即座に現在地の緯度・経度を読み上げる機能
    function speakCurrentLocation() {
        if (!navigator.geolocation) {
            alert("お使いの端末はGPSに対応していません");
            return;
        }

        speak("現在地を取得中");

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude.toFixed(4);
                const lng = pos.coords.longitude.toFixed(4);

                // 小数点「.」を「てん」に変換して聞き取りやすく整形
                const latText = lat.toString().replace('.', '点');
                const lngText = lng.toString().replace('.', '点');

                document.getElementById('coordsVal').textContent = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
                
                speak(`現在の位置は、緯度${latText}、経度${lngText}です`);
            },
            (err) => {
                speak("位置情報の取得に失敗しました");
                console.warn('GPSエラー: ' + err.message);
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }

    function checkTimeAndAnnounce() {
        if (!isTracking || !startTime) return;
        
        const now = new Date();
        const elapsedMinutes = Math.floor((now - startTime) / 60000);

        document.getElementById('timeVal').textContent = `${elapsedMinutes}分`;

        if (elapsedMinutes > 0 && elapsedMinutes > lastAnnouncedMinute) {
            lastAnnouncedMinute = elapsedMinutes;
            const dist = Math.round(totalDistance);
            speak(`歩き出して${elapsedMinutes}分経過しました。現在およそ${dist}メートル歩きました。`);
        }
    }

    function getDirection(deg) {
        if (deg >= 337.5 || deg < 22.5) return "北";
        if (deg >= 22.5 && deg < 67.5) return "北東";
        if (deg >= 67.5 && deg < 112.5) return "東";
        if (deg >= 112.5 && deg < 157.5) return "南東";
        if (deg >= 157.5 && deg < 202.5) return "南";
        if (deg >= 202.5 && deg < 247.5) return "南西";
        if (deg >= 247.5 && deg < 292.5) return "西";
        if (deg >= 292.5 && deg < 337.5) return "北西";
        return "不明";
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function handleError(err) {
        console.warn('GPSエラー: ' + err.message);
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            uttr.rate = 1.0;
            speechSynthesis.speak(uttr);
        }
    }
</script>

</body>
</html>
